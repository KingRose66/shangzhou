name: Verify game build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static game verification
        run: node scripts/verify.mjs
      - name: Install DOM and browser test harness
        run: npm install --no-save jsdom@24 playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser DOM smoke test
        run: node scripts/browser-smoke.mjs
      - name: Multi-year campaign soak test
        run: node scripts/campaign-soak.mjs
      - name: Tactical facing and flank logic
        run: node scripts/battle-logic.mjs
      - name: Character succession and events
        run: node scripts/character-events.mjs
      - name: Geographic map and character placement regression
        run: node scripts/geography-characters.mjs
      - name: Real browser geographic map verification
        run: node scripts/visual-map.mjs
      - name: Upload geographic map screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-real-map
          path: artifacts/real-map-verified.png
          if-no-files-found: ignore
      - name: Gameplay logistics and autonomous battle regression
        run: node scripts/gameplay-regression.mjs
