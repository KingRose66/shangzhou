name: Verify game build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static game verification
        run: node scripts/verify.mjs
      - name: Install smoke-test DOM
        run: npm install --no-save jsdom@24
      - name: Browser DOM smoke test
        run: node scripts/browser-smoke.mjs
