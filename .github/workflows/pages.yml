name: Deploy Shangzhou to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare bundled realistic terrain
        run: |
          python3 -m pip install --user --quiet numpy Pillow basemap-data
          python3 scripts/build-terrain.py
          test -s assets/china-satellite.webp
          test -s assets/china-relief.webp
      - name: Commit reproducible geographic assets
        run: |
          git add assets/china-satellite.webp assets/china-relief.webp
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: bundle NASA imagery and terrain relief [skip ci]'
            git push origin HEAD:main || echo 'Asset push skipped due to concurrent main change; Pages build still includes assets.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
